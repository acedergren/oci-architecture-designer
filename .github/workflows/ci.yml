name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check Python syntax
        run: python -m compileall -q skills tests
      - name: Validate package and helpers
        run: python -B scripts/check.py
      - name: Build source package
        run: git archive --format=zip --output=oci-architecture-designer.zip HEAD plugin.json .codex-plugin skills README.md docs scripts tests
      - name: Upload source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oci-architecture-designer-${{ github.sha }}
          path: oci-architecture-designer.zip
          if-no-files-found: error
          retention-days: 7
